<div class="section" *ngIf="loading">Loading...</div>
<div class="section" *ngIf="error">{{ error }}</div>

<div class="section" *ngIf="!loading && stockDetails as d">
  <h2>{{ d.name || d.symbol }} ({{ d.symbol }})</h2>

  <div class="section" *ngIf="d.logo">
    <img
      [src]="d.logo"
      alt="logo"
      style="width: 60px; height: 60px; border-radius: 8px"
    />
  </div>

  <p *ngIf="d.exchange"><strong>Exchange:</strong> {{ d.exchange }}</p>
  <p *ngIf="d.currency"><strong>Currency:</strong> {{ d.currency }}</p>

  <hr />

  <p *ngIf="d.description"><strong>Description:</strong> {{ d.description }}</p>

  <hr />
  <h3>Quote</h3>
  <p><strong>Price:</strong> {{ d.price ?? "-" }}</p>

  <p *ngIf="d.quote_source"><strong>Source:</strong> {{ d.quote_source }}</p>
  <p *ngIf="d.quote_error" style="color: #b00020">
    <strong>Quote error:</strong> {{ d.quote_error }}
  </p>
  <a
    *ngIf="d.website"
    class="btn"
    style="margin-top: 14px; display: inline-flex"
    [href]="d.website"
    target="_blank"
    rel="noreferrer"
  >
    Visit website
  </a>
  <hr />

  <label>
    Quantity:
    <input type="number" [(ngModel)]="quantity" min="1" />
  </label>

  <button
    (click)="addHolding()"
    [disabled]="!d.price || quantity <= 0 || adding"
  >
    {{ adding ? "Adding..." : "Add to holdings" }}
  </button>

  <p *ngIf="addMessage">{{ addMessage }}</p>

  <button *ngIf="addMessage" routerLink="/holdings">go to portfolio</button>
  <button (click)="goBack()">Go Back</button>
</div>
